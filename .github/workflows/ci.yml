name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR/branch supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run bot:build

  # Runs only after `check` passes on a push to main. Railway's "Wait for CI"
  # holds the app and bot deploys until this whole workflow is green, so new
  # code never goes live against an old schema. Secrets live in the
  # `production` GitHub Environment so pull request runs can never read them.
  deploy-database:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    # Separate group, and never cancel: an interrupted migration run could
    # leave the database half-updated.
    concurrency:
      group: deploy-database
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      # Applies only migrations missing from the remote history.
      - run: supabase db push
      - run: supabase functions deploy sync-tournament-sheets --project-ref "$SUPABASE_PROJECT_ID"
